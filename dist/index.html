<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8f7f2" />
    <meta
      name="description"
      content="音楽理論はいりません。カラフルなパッドをタップして、音で遊ぶ小さな音楽の実験室。"
    />
    <title>oto — 音であそぼう</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./skins.css" />
    <script type="module" src="./app.js"></script>
    <script type="module" src="./skins.js"></script>
  </head>
  <body>
    <div class="shell">
      <header class="player-header">
        <div class="player-left"><div class="player-brand">
        <a class="logo" href="./" aria-label="oto ホーム">oto<span>●</span></a
        >
        <div class="buddy-guide"><button id="oto-buddy" type="button" aria-label="Otto（オットー）にあいさつ" title="やあ。" data-mood="idle">
          <svg viewBox="0 0 28 28" aria-hidden="true" focusable="false">
            <circle class="buddy-case" cx="14" cy="14" r="11"/>
            <path class="record-grooves" d="M5.5 10A9 9 0 0 1 12 5.5M22.5 18A9 9 0 0 1 16 22.5"/>
            <path class="buddy-eyes" d="M10.5 12v3m7-3v3"/>
            <path class="buddy-happy-eyes" d="M9 14 Q10.5 11.5 12 14 M16 14 Q17.5 11.5 19 14"/>
            <circle class="record-center" cx="14" cy="15" r="1.2"/>
            <path class="buddy-error-eyes" d="m9 12 3 3m0-3-3 3m7-3 3 3m0-3-3 3"/>
            <path class="buddy-error-mouth" d="M12 19h4"/>
            <path class="record-fringe" d="M8 9q3-5 10-1l2 3q-5-3-12-2z"/>
            <path class="record-spikes" d="M6 10C7 6 12 4 18 6L22 9L17 8L18 11L13 8L13 11L10 9L8 12Z"/>
            <path class="record-lashes" d="m9 12-2-1m3 0-1-2m9 3 2-1m-3 0 1-2"/>
            <g class="record-glasses"><circle cx="10" cy="13" r="3"/><circle cx="18" cy="13" r="3"/><path d="M13 13h2"/></g>
            <path class="record-beret" d="M5 7q0-6 12-4l1-2 1 1-1 2q6 2 5 5z"/>
            <path class="record-bow" d="M20 5q-6-6-5 1l5 1q7 4 5-3z"/>
            <g class="record-headphones"><path d="M3 14V11a11 11 0 0 1 22 0v3"/><rect x="1" y="11" width="4" height="8" rx="2"/><rect x="23" y="11" width="4" height="8" rx="2"/></g>
          </svg>
        </button><p id="buddy-message" class="buddy-message" role="status" aria-live="polite">スタイルを選んで再生してみよう。鳴らしながら各パートの奏法を変えると、曲の表情が変わるよ。</p></div>
        </div>
        <div class="player-transport"><div class="style-stepper" role="group" aria-label="スタイルを切り替え"><button id="style-prev" type="button" aria-label="前のスタイル">←</button><button id="style-next" type="button" aria-label="次のスタイル">→</button></div><div id="transport" class="transport"></div></div></div>
        <div id="player-display"></div>
        <div class="player-actions">
          <details id="settings-menu">
            <summary id="settings-open" class="appearance-open" aria-label="設定" title="設定">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 3-.6 2.3-2 .9-2-.9-2 3.4 1.7 1.5v2.4l-1.7 1.5 2 3.4 2-.8 2 .9.6 2.4h4l.6-2.4 2-.9 2 .8 2-3.4-1.7-1.5v-2.4l1.7-1.5-2-3.4-2 .9-2-.9L14 3z"/><circle cx="12" cy="11.5" r="3"/></svg>
            </summary>
            <div class="settings-options">
              <div id="count-in-control"></div>
              <button id="song-open" type="button" aria-haspopup="dialog" aria-controls="song-dialog">設定保存／ロード</button>
              <button id="appearance-open" type="button" aria-haspopup="dialog" aria-controls="appearance-dialog">外観</button>
            </div>
          </details>
        </div>
      </header>
      <main data-workspace-view="mixer">
        <div class="workspace-heading">
          <fieldset class="segmented-control workspace-switch" aria-label="編集ビュー">
            <legend class="sr-only">編集ビュー</legend>
            <label><input type="radio" name="workspace-view" value="melody"><span>メロディ</span></label>
            <label><input type="radio" name="workspace-view" value="mixer" checked><span>楽器ミキサー</span></label>
            <label><input type="radio" name="workspace-view" value="score"><span>コード進行</span></label>
          </fieldset>
          <div id="score-section-context" aria-live="polite"></div>
        </div>
        <section
          class="instrument groove progression"
          aria-label="リズム設定"
        >


          <div class="mixer-watermark" aria-hidden="true"><span>Arrange Mixer</span></div>
          <div class="genre-row" role="group" aria-label="ジャンルを選択">
            <label class="groove-field">ジャンル<select id="genre-group" aria-label="ジャンルの大分類"></select></label>
            <select id="genre" aria-label="ジャンルのスタイル" hidden></select>
          </div>
          <div class="mixer-sections"><span class="mixer-sections-label">セクション</span><div id="song-sections" class="song-sections" role="group" aria-label="曲のセクション"></div></div>
          <div class="groove-settings">
            <div class="mixer-key"><label for="mixer-key">キー</label>
              <span class="volume-knob key-knob"><input id="mixer-key" type="range" min="-12" max="12" step="1" value="0" aria-label="キーを半音ずつ変更" /><span aria-hidden="true"></span></span>
              <output id="mixer-key-value" for="mixer-key">C</output>
            </div>
            <div class="mixer-meter"><label for="meter">拍子</label>
              <span class="volume-knob meter-knob"><input id="meter" type="range" min="3" max="5" step="1" value="4" aria-label="拍子" /><span aria-hidden="true"></span></span>
              <output id="meter-value" for="meter">4/4</output>
            </div>
            <div class="groove-timing">
              <label class="timing-control" for="tempo"
                ><span>テンポ</span>
                <input
                  id="tempo"
                  type="range"
                  min="40"
                  max="200"
                  value="100"
                  step="0.1"
                /><input id="tempo-value" type="number" inputmode="decimal" min="40" max="200" step="0.1" value="100" aria-label="テンポを数値で入力" /></label
              >
              <label class="timing-control swing-control" for="swing"
                ><span class="swing-caption">ノリ</span>
                <input
                  id="swing"
                  type="range"
                  min="0"
                  max="100"
                  value="0"
                  step="1"
                /><output id="swing-value" for="swing">0%</output></label
              >
            </div>
          </div>
          <div class="mixer-banks">
          <div id="track-grid" class="track-grid" aria-label="パートの設定"></div></div>
          <p id="progression-status" role="status"></p>
        </section>
        <section class="instrument track-details" aria-label="トラックの詳細">
            <div
              id="detail-drums"
              class="drum-detail"
              role="region"
              aria-label="ドラムの詳細"
              hidden
            ><div class="drum-detail-heading"><h2 class="track-detail-title">好きなリズムを作ってみよう。</h2><fieldset class="segmented-control drum-rate" aria-label="ドラムの速度"><legend class="sr-only">ドラムの速度</legend><label><input type="radio" name="drum-rate" value="0.5"><span>ハーフ</span></label><label><input type="radio" name="drum-rate" value="1" checked><span>通常</span></label><label><input type="radio" name="drum-rate" value="2"><span>ダブル</span></label></fieldset></div><div id="drum-sequencer" class="drum-sequencer" role="group" aria-label="16ステップのドラムシーケンサー"></div></div>
            <div
              id="detail-bass"
              class="bass-detail"
              role="region"
              aria-label="ベースの詳細"
              hidden
            >
            </div>
            <div
              id="detail-chord"
              role="region"
              aria-label="コード進行"
            >
              <div class="chord-heading"><div id="section-bar-count" hidden></div><div class="backing-display"><div id="backing-monitor" role="img" aria-label="バッキングの鍵盤表示"></div></div></div>
              <div class="chord-settings">
                <div class="chord-field chord-start" hidden><label for="preset-group">開始度数</label><select id="preset-group" aria-label="プリセットの開始度数" aria-controls="preset"></select></div>
                <div class="chord-field chord-preset"><label for="preset">コード進行</label><div class="preset-picker"><select id="preset" aria-label="コード進行プリセット"></select><div class="style-stepper" role="group" aria-label="コード進行を切り替え"><button id="preset-prev" type="button" aria-label="前のコード進行">▲</button><button id="preset-next" type="button" aria-label="次のコード進行">▼</button></div></div></div>
                <div class="chord-field" hidden><label for="chord-rate">進行の速さ</label><select id="chord-rate"><option value="0.5">½ ハーフ</option><option value="1" selected>1 通常</option><option value="2">2 ダブル</option></select></div>
                <div class="chord-field chord-key"><label for="key">キー</label><div class="key-control" role="group" aria-label="キー">
                  <select id="key" aria-label="キー（メジャー）"></select>
                  <div class="key-stepper" role="group" aria-label="キーを半音ずつ変更">
                    <button id="key-down" type="button" aria-label="キーを半音下げる">−</button>
                    <button id="key-up" type="button" aria-label="キーを半音上げる">＋</button>
                  </div>
                </div>
                </div>
                <div class="chord-field chord-notation"><span class="chord-field-label">表示</span><fieldset id="notation" class="segmented-control">
                  <legend class="sr-only">コードの表示形式</legend>
                  <label
                    ><input
                      type="radio"
                      name="notation"
                      value="number"
                      checked
                    /><span>数字</span></label
                  >
                  <label
                    ><input type="radio" name="notation" value="roman" /><span
                      >ローマ字</span
                    ></label
                  >
                  <label
                    ><input type="radio" name="notation" value="chord" /><span
                      >コード</span
                    ></label
                  >
                </fieldset></div>
              </div>
              <div
                class="chord-grid-scroll"
                tabindex="0"
                role="region"
                aria-label="コード進行（横スクロール可能）"
              >
                <div
                  id="chord-slots"
                  class="chord-slots"
                  role="group"
                  aria-label="8小節のコード進行"
                ></div>
              </div>
            </div>
        </section>
        <section id="detail-melody" class="instrument" aria-labelledby="instrument-title" hidden>
          <div class="melody-heading"><h2 id="instrument-title" class="track-detail-title">Ottoとセッション。</h2></div>
          <div id="buddy-inline" class="buddy-inline"></div>
          <div class="melody-view" role="group" aria-label="演奏する鍵盤"><button type="button" data-melody-view="pads" aria-pressed="false">8 Pad</button><button type="button" data-melody-view="piano" aria-pressed="true">3オクターブ鍵盤</button><button type="button" data-melody-view="magic" aria-pressed="false">マジック鍵盤</button><div class="melody-chord" aria-label="現在のコード"><strong id="melody-current-chord"></strong></div></div>
          <div id="piano-scroll" class="piano-scroll"><div id="piano-keys" role="group" aria-label="C3からC6の鍵盤。押したまま滑らせてグライド。矢印キーで移動、スペースかEnterで演奏。"></div></div>
          <div
            id="pads" hidden
            class="pads"
            role="group"
            aria-label="8つの音のパッド"
          ></div>
          <p id="melody-feedback" class="melody-feedback" aria-live="polite"></p>
          <p id="status" role="status"></p>
        </section>
      </main>
    </div>
    <dialog id="reference-crop" class="appearance-dialog" aria-labelledby="reference-crop-title">
      <form method="dialog">
        <div class="crop-heading"><span class="talk-avatar crop-buddy" aria-hidden="true"></span><h2 id="reference-crop-title">曲の1拍目の頭を指定してね</h2></div>
        <p>波形を動かして位置を選ぼう · スペースで再生／停止</p>
        <div class="reference-timeline crop-timeline">
          <svg viewBox="0 0 1000 100" preserveAspectRatio="none" aria-hidden="true">
            <path></path><rect height="100" width="0"></rect>
          </svg>
          <input id="ref-crop-position" type="range" min="0" step="0.001" value="0" aria-label="切り出しの開始位置">
        </div>
        <div class="crop-scale"><span>0:00.0</span><div class="crop-scale-end">
          <button id="ref-crop-zoom-out" type="button" aria-label="波形を縮小">−</button><button id="ref-crop-zoom-in" type="button" aria-label="波形を拡大">＋</button><span id="ref-crop-end">0:15.0</span>
          <button id="ref-crop-extend" type="button">＋15秒</button>
        </div></div>
        <div class="ref-import-feedback"><span class="ref-import-spinner" aria-hidden="true"></span><p id="ref-import-status" role="status"></p></div>
        <div class="crop-adjust">
          <output id="ref-crop-time" for="ref-crop-position">0:00.0</output>
          <div class="crop-stepper" role="group" aria-label="開始位置の調整">
            <button id="ref-crop-back" type="button" aria-label="開始位置を0.1秒戻す">←</button>
            <button id="ref-crop-forward" type="button" aria-label="開始位置を0.1秒進める">→</button>
          </div>
          <button id="ref-crop-preview" type="button">▶ 試聴</button>
        </div>
        <div class="reference-row crop-actions">
          <button value="cancel" hidden>中断</button>
          <button value="ok">処理</button>
          <button id="ref-remove" type="button" hidden>曲を外す</button>
        </div>
      </form>
    </dialog>
    <dialog id="song-dialog" class="appearance-dialog" aria-labelledby="song-title"></dialog>
    <dialog id="appearance-dialog" class="appearance-dialog" aria-labelledby="appearance-title" aria-describedby="appearance-description"></dialog>
  </body>
</html>
