<style>
  * { box-sizing:border-box; }
  body { margin:0; background:#dbe8fa; color:#213b57; font:16px system-ui,sans-serif; }
  main { max-width:800px; margin:auto; padding:24px 16px; }
  h1 { font-size:1.25rem; margin:0 0 14px; }
  figure { margin:0 0 12px; overflow-x:auto; background:#d2e1f5; border-radius:8px; }
  svg { display:block; width:100%; min-width:620px; fill:currentColor; }
  path { fill:none; stroke:currentColor; stroke-width:1.3; }
  .beat { opacity:.22; stroke-dasharray:2 2; }
  .bar { fill:#fff; width:27px; }
  .duration-switch { display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center;
    margin:0 0 14px; padding:8px 12px; border:1px solid #9eb4cf; border-radius:8px; }
  .duration-switch label { display:inline-flex; align-items:center; gap:6px; min-height:36px; cursor:pointer; }
  .flag { display:none; }
  main:has(#sixteenth:checked) .bar { width:6.75px; transform:translateX(9.625px); }
  main:has(#eighth:checked) .bar { width:13.5px; transform:translateX(6.25px); }
  main:has(#half:checked) .bar { width:54px; }
  main:has(#half:checked) ellipse { fill:none; stroke:currentColor; stroke-width:1.4; }
  main:has(#sixteenth:checked, #eighth:checked) .flag-first,
  main:has(#sixteenth:checked) .flag-second { display:inline; }
  .staff { opacity:.8; }
  .name { font-size:13px; text-anchor:middle; }
  .accidental { font-size:17px; text-anchor:end; }
</style>
